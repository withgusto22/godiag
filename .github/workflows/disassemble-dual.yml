name: Disassemble SH7058 DUAL kernel

on:
  push:
    paths:
      - "analysis_tmp/subarush7058dual_decrypted.b64"
      - ".github/workflows/disassemble-dual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disassemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SH-2 disassembler
        run: python -m pip install --upgrade pip && python -m pip install git+https://github.com/logic/sh2dis.git
      - name: Decode and disassemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          base64 -d analysis_tmp/subarush7058dual_decrypted.b64 > output/dual.bin
          python - <<'PY'
          from pathlib import Path
          from types import SimpleNamespace
          import hashlib
          from sh2dis import segment, sh2
          data = Path("output/dual.bin").read_bytes()
          if len(data) != 4660:
              raise SystemExit(f"Wrong size: {len(data)}")
          base = 0xFFFF3000
          model = segment.MemoryModel(SimpleNamespace(), [("DUAL", base, base+len(data), data)])
          seeds = [base+0x30, base+0x100, base+0x200, base+0x300, base+0x400, base+0x4A0, base+0x4D0, base+0x800, base+0x900, base+0xA00, base+0xB00, base+0xC00, base+0xD00, base+0xE00, base+0xF00, base+0x1000]
          for start in seeds:
              try:
                  sh2.disassemble([(start, start)], model)
              except Exception as e:
                  print(f"seed 0x{start:08X} stopped: {type(e).__name__}: {e}")
          out=[]
          for addr in range(base, base+len(data)-1, 2):
              item=model.get_location(addr)
              if isinstance(item, sh2.CodeField):
                  op=int.from_bytes(data[addr-base:addr-base+2],"big")
                  out.append(f"{addr:08X}: {op:04X}  {item.get_instruction()}")
          Path("output/subarush7058dual_disassembly.txt").write_text("\n".join(out)+"\n")
          print("size",len(data))
          print("sha256",hashlib.sha256(data).hexdigest())
          print("disassembled",len(out),"instructions")
          print("seed addresses",[f"0x{x:08X}" for x in seeds])
          print("version",data[data.find(b"OpenECU"):data.find(b"OpenECU")+42])
          print("first 120 lines:")
          print("\n".join(out[:120]))
          PY
          cp analysis_tmp/subarush7058dual_decrypted.b64 output/
      - uses: actions/upload-artifact@v4
        with:
          name: subarush7058dual-disassembly
          path: output/
          retention-days: 2
