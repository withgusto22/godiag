name: Analyze SH7058 DUAL kernel

on:
  push:
    paths:
      - "analysis_tmp/subarush7058dual_decrypted.b64"
      - ".github/workflows/analyze-dual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disassemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SH-2 disassembler
        run: python -m pip install --upgrade pip && python -m pip install git+https://github.com/logic/sh2dis.git
      - name: Verify and disassemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          base64 -d analysis_tmp/subarush7058dual_decrypted.b64 > output/dual.bin
          python - <<'PY'
          from pathlib import Path
          from types import SimpleNamespace
          import hashlib
          from sh2dis import segment, sh2

          data = Path("output/dual.bin").read_bytes()
          expected = "b0989858ec59c7c281c1368d956a7187b353454683b248be5f1739c86835b082"
          digest = hashlib.sha256(data).hexdigest()
          print("size", len(data), "sha256", digest)
          if len(data) != 4660 or digest != expected:
              raise SystemExit("Payload differs from verified source extraction")

          base = 0xFFFF3000
          model = segment.MemoryModel(SimpleNamespace(), [("DUAL", base, base+len(data), data)])

          # The command table is mixed-format: little-endian command IDs,
          # followed by big-endian SH7058 handler addresses.
          records = []
          for off in range(0x1150, 0x11B0, 8):
              if off+8 > len(data):
                  break
              command = int.from_bytes(data[off:off+4], "little")
              target = int.from_bytes(data[off+4:off+8], "big")
              if base <= target < base+len(data) and target % 2 == 0:
                  records.append((off, command, target))

          roots = {base+0x30, base+0x400, base+0x4A0, base+0x4D0}
          roots.update(target for _,_,target in records)
          errors=[]
          for root in sorted(roots):
              try:
                  sh2.disassemble([(root, root)], model)
              except Exception as e:
                  errors.append((root, type(e).__name__, str(e)))

          lines=[]
          for addr in range(base, base+len(data)-1, 2):
              item=model.get_location(addr)
              if isinstance(item, sh2.CodeField):
                  opcode=int.from_bytes(data[addr-base:addr-base+2], "big")
                  lines.append(f"{addr:08X}: {opcode:04X}  {item.get_instruction()}")

          table=["Offset  Command ID  Handler Address"]
          for off,cmd,target in records:
              table.append(f"0x{off:04X}  0x{cmd:08X}  0x{target:08X}")
          Path("output/dual_disassembly.txt").write_text("\n".join(lines)+"\n")
          Path("output/dual_command_table.txt").write_text("\n".join(table)+"\n")
          summary=[
              "OpenECU Subaru SH7058 DUAL Kernel V1.07",
              f"Image bytes: {len(data)}",
              f"SHA-256: {digest}",
              f"Disassembled instructions: {len(lines)}",
              f"Command table entries: {len(records)}",
              f"Disassembly roots: {len(roots)}",
              f"Seed errors: {len(errors)}",
              "",
              *table,
              "",
              "Seed errors:",
              *[f"0x{a:08X}: {t}: {m}" for a,t,m in errors],
          ]
          Path("output/dual_summary.txt").write_text("\n".join(summary)+"\n")
          print("\n".join(summary))
          print("\nFirst 100 decoded instructions:")
          print("\n".join(lines[:100]))
          print("\nCommand handler windows:")
          for off,cmd,target in records:
              print(f"\n--- ID 0x{cmd:08X} handler 0x{target:08X} ---")
              selected=[]
              for line in lines:
                  address=int(line[:8],16)
                  if target <= address < target+0x60:
                      selected.append(line)
              print("\n".join(selected))
          PY
          cp analysis_tmp/subarush7058dual_decrypted.b64 output/
      - uses: actions/upload-artifact@v4
        with:
          name: subarush7058dual-full-analysis
          path: output/
          retention-days: 2
