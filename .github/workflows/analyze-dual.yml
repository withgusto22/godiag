name: Analyze SH7058 DUAL kernel

on:
  push:
    paths:
      - "analysis_tmp/subarush7058dual_decrypted.b64"
      - ".github/workflows/analyze-dual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disassemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SH-2 disassembler
        run: python -m pip install --upgrade pip && python -m pip install git+https://github.com/logic/sh2dis.git
      - name: Verify and disassemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          base64 -d analysis_tmp/subarush7058dual_decrypted.b64 > output/dual.bin
          python - <<'PY'
          from pathlib import Path
          from types import SimpleNamespace
          import hashlib, re
          from sh2dis import segment, sh2

          data = Path("output/dual.bin").read_bytes()
          expected = "b0989858ec59c7c281c1368d956a7187b353454683b248be5f1739c86835b082"
          digest = hashlib.sha256(data).hexdigest()
          print("decoded_size", len(data))
          print("decoded_sha256", digest)
          if len(data) != 4660 or digest != expected:
              raise SystemExit("Staged image does not match the verified extracted kernel")
          base = 0xFFFF3000
          model = segment.MemoryModel(SimpleNamespace(), [("DUAL", base, base + len(data), data)])

          # Documented command-dispatch table found at 0x1168.
          dispatch = []
          for off in range(0x1150, 0x11B0, 8):
              if off + 8 > len(data):
                  break
              cmd = int.from_bytes(data[off:off+4], "big")
              target = int.from_bytes(data[off+4:off+8], "big")
              if base <= target < base + len(data) and target % 2 == 0:
                  dispatch.append((cmd, target, off))

          # Include kernel start and SCI routine plus all registered command handlers.
          seeds = {base + x for x in (0x30, 0x400, 0x4A0, 0x4D0, 0x780, 0x840, 0xAC0, 0xD00, 0xE00, 0xF00)}
          for cmd, target, off in dispatch:
              seeds.add(target)
          # Scan aligned 32-bit values for additional absolute in-image pointers.
          pointers = []
          for off in range(0, len(data)-3, 2):
              v = int.from_bytes(data[off:off+4], "big")
              if base <= v < base + len(data) and v % 2 == 0:
                  pointers.append((off, v))
                  seeds.add(v)
          failures = []
          for start in sorted(seeds):
              try:
                  sh2.disassemble([(start, start)], model)
              except Exception as e:
                  failures.append((start, type(e).__name__, str(e)))
          lines=[]
          for addr in range(base, base+len(data)-1, 2):
              item=model.get_location(addr)
              if isinstance(item, sh2.CodeField):
                  op=int.from_bytes(data[addr-base:addr-base+2], "big")
                  lines.append(f"{addr:08X}: {op:04X}  {item.get_instruction()}")
          Path("output/dual_disassembly.txt").write_text("\n".join(lines)+"\n")
          table = ["Command / handler table (file offset 0x1150 onward):",
                   "offset  command-id  handler"]
          for cmd, target, off in dispatch:
              table.append(f"0x{off:04X}  0x{cmd:08X}  0x{target:08X}")
          Path("output/dual_dispatch_table.txt").write_text("\n".join(table)+"\n")
          summary = [
              "OpenECU SH7058 DUAL Kernel V1.07",
              f"Size: {len(data)} bytes",
              f"SHA-256: {digest}",
              f"Disassembled instruction locations: {len(lines)}",
              f"Candidate in-image pointer words: {len(pointers)}",
              f"Disassembly roots: {len(seeds)}",
              f"Seed failures: {len(failures)}",
              "",
              "Dispatch table:",
              *table,
              "",
              "Seed failures (first 50):",
              *[f"0x{a:08X}: {t}: {m}" for a,t,m in failures[:50]],
          ]
          Path("output/analysis_summary.txt").write_text("\n".join(summary)+"\n")
          print("\n".join(summary))
          print("First 120 disassembled instructions:")
          print("\n".join(lines[:120]))
          print("Instruction lines around handler targets:")
          for cmd,target,off in dispatch:
              rel=target-base
              print(f"\n--- command 0x{cmd:08X} -> 0x{target:08X} ---")
              print("\n".join(x for x in lines if int(x[:8],16) >= target and int(x[:8],16) < target+0x70)[:4000])
          PY
          cp analysis_tmp/subarush7058dual_decrypted.b64 output/
      - uses: actions/upload-artifact@v4
        with:
          name: subarush7058dual-full-analysis
          path: output/
          retention-days: 2
