name: Reassemble Task Manager TTT dump

on:
  push:
    paths:
      - ".github/workflows/reassemble-ttt-dump.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reassemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unzip

      - name: Reassemble and validate Task Manager dump
        shell: bash
        run: |
          set -euo pipefail
          parts=("ttt (2).zip.001" "ttt (2).zip.002" "ttt (2).zip.003" "ttt (2).zip.004")
          for part in "${parts[@]}"; do
            test -s "$part"
          done

          mkdir -p recovered
          if 7z t "${parts[0]}" >/tmp/7z-test.log 2>&1; then
            7z x -y -orecovered "${parts[0]}"
          else
            cat "${parts[@]}" > recovered/task-manager-dump.zip
            unzip -t recovered/task-manager-dump.zip
            unzip -o recovered/task-manager-dump.zip -d recovered/extracted
          fi

          find recovered -type f -printf '%p %s bytes\n'
          find recovered -type f \( -iname '*.dmp' -o -iname '*.mdmp' \) -print -quit | grep -q .

      - name: Upload recovered Task Manager dump
        uses: actions/upload-artifact@v4
        with:
          name: task-manager-ttt-dump
          path: recovered/
          if-no-files-found: error
          retention-days: 2
